name: Deploy game garden to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'release/math-game-garden/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'johnson611008/math-game-garden'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Verify release inventory and hashes
        shell: python
        run: |
          import hashlib, json
          from pathlib import Path
          root = Path('release/math-game-garden')
          manifest = json.loads((root / 'deployment-manifest.json').read_text(encoding='utf-8'))
          expected = {f['path'] for f in manifest['files']} | {'deployment-manifest.json'}
          actual = {p.relative_to(root).as_posix() for p in root.rglob('*') if p.is_file()}
          assert actual == expected, 'Unexpected or missing release files'
          assert not any(p.is_symlink() for p in root.rglob('*')), 'Symlinks forbidden'
          for item in manifest['files']:
              relative = Path(item['path'])
              assert not relative.is_absolute() and '..' not in relative.parts
              data = (root / relative).read_bytes()
              assert len(data) == item['bytes'], item['path']
              assert hashlib.sha256(data).hexdigest() == item['sha256'], item['path']
          assert manifest['buildId'] == 'f782b5fbf3c7966399026292f72f90e5b977f9f218b089b77510873e0f829a39'
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload only the verified website
        uses: actions/upload-pages-artifact@v4
        with:
          path: release/math-game-garden/
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
