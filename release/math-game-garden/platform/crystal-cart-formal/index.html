<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>根式水晶礦車｜正式十題</title><link rel="icon" href="../crystal-cart-demo/assets/crystal_blue_candidate.png"><link rel="stylesheet" href="style.css"></head><body>
<main><header><div><small>第四單元 · 正式十題挑戰</small><h1>根式水晶礦車</h1></div><div class="settings"><a href="../game-garden/">返回大觀園</a><button id="motion" aria-pressed="false">降低動畫</button></div></header>
<section class="question" aria-label="目前題目"><span id="progress">十題正式挑戰</span><strong id="expression">開始後，每題有30秒接取時間</strong><span id="score">首次至少8／10達標</span><strong id="timer" role="timer"></strong></section>
<p id="save-status" role="status">正在讀取已確認紀錄…</p>
<section id="field" aria-label="水晶下降場地"><div id="crystals"></div><div id="cart"><img id="rider" src="../crystal-cart-demo/assets/rider/mole_cart_normal.png" alt="地鼠坐在礦車內" draggable="false"></div><div id="sparkles" aria-hidden="true"></div><div id="fracture" hidden aria-label="正確水晶與答案破裂效果"><img class="falling-gem" src="../crystal-cart-demo/assets/crystal_blue_candidate.png" alt="正確水晶"><div id="fracture-answer" class="fracture-answer"></div><span class="cracks" aria-hidden="true"></span><div class="shards" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div></div><div id="overlay" hidden></div></section>
<div id="notice" role="status" aria-live="polite">確認素材與保存機制後，可以開始正式挑戰。</div><nav aria-label="遊戲操作"><button id="left" disabled>← 左移</button><button id="right" disabled>右移 →</button><button id="new" class="primary" disabled>開始正式十題</button><button id="next" class="primary" hidden>下一題</button><button id="settle" class="primary" hidden>確認完成挑戰</button><button id="reload">重新讀取紀錄</button></nav>
<footer>← → 或長按按鈕移動 · 無手動暫停 · 離頁仍計時 · F5只恢復已確認狀態，同一題不重給30秒。</footer></main><script type="module" src="main.mjs"></script></body></html>
