<main><p id="mode"></p><p id="save-status" role="status">讀取確認紀錄中…</p><p id="message" role="alert"></p><nav class="actions"><button id="new" disabled>開始十題自主練習</button><button id="pause" disabled>暫停</button><button id="reload">重新載入確認紀錄</button><button id="export">匯出原始紀錄</button></nav>
