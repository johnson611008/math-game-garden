<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>第五關｜水晶城堡補救練功區</title><link rel="icon" href="../rescue-battle-demo/assets/crystal.png"><link rel="stylesheet" href="style.css"></head>
<body><header><div><small>第五關 · 根式乘法公式</small><h1>水晶城堡練功區</h1></div><a id="back" href="../rescue-battle-formal/">返回救援挑戰</a></header><main>
 <div class="status-row"><p id="save-status" role="status">正在讀取已確認紀錄</p><button id="reload" type="button">重新讀取</button></div><p id="message" role="alert"></p>
 <div class="practice-grid"><aside class="training-scene"><img src="../rescue-battle-demo/assets/characters/hero_mole.png" alt="勇者地鼠在水晶城堡重新練功"><div><h2>練好公式，再出發</h2><p>不限時間，逐題想清楚。<br>訂正會保留努力，首次結果也會保留。</p><nav><button id="new" type="button" disabled>開始補救練功</button></nav></div></aside>
 <section id="workspace" class="panel" hidden aria-label="補救作答區"><div class="progress-row"><h2 id="progress"></h2><span id="answer-kind"></span></div><p id="concept"></p><h3 id="question" class="math"></h3>
  <form id="answer-form" autocomplete="off"><label for="answer">輸入最簡根式答案</label><input id="answer" type="text" inputmode="none" maxlength="256" autocomplete="off" autocapitalize="off" spellcheck="false" aria-describedby="input-help feedback"><small id="input-help">可輸入整數、√、分數與兩項根式；分母有根號時先有理化。</small><div id="symbols" aria-label="自製數學鍵盤"></div></form>
  <p id="feedback" role="status" aria-live="polite"></p><nav class="actions"><button id="submit" type="submit" form="answer-form">確認答案</button><button id="hint" type="button">觀念提示</button><button id="next" type="button">下一題</button><button id="finish" type="button" hidden>確認完成練功</button></nav><p id="hint-text"></p><p id="score"></p>
 </section><section id="result" class="panel" hidden aria-labelledby="result-title"><h2 id="result-title">本次練功成果</h2><p id="result-text"></p><p id="qualification-note"></p><button id="rechallenge" type="button" hidden>重新挑戰 Boss</button><a href="../rescue-battle-formal/">返回救援挑戰查看狀態</a></section>
 </div><details><summary>查看補救歷史</summary><ul id="history"></ul><ol id="review"></ol></details><footer>指定補救綁定已結算的救援失敗回合。十題首次至少8題正確才達標；一次資格只能建立一個新正式回合。文字必須提交並確認保存，尚未提交的輸入不保證恢復。</footer>
</main><noscript>需要 JavaScript 才能安全讀取與保存補救紀錄。</noscript><script type="module" src="main.mjs"></script></body></html>
