<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>根式四則運算自主練習</title><link rel="stylesheet" href="../styles/platform.css"><link rel="stylesheet" href="../styles/practice.css"><style>main{max-width:900px;margin:auto;padding:20px}button,input{min-height:48px;font-size:1.1rem}#symbols{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}#symbols button{min-width:48px}#question{font-size:clamp(22px,4vw,34px);overflow-wrap:anywhere}input{width:100%;box-sizing:border-box}section{padding:16px;margin:16px 0;border-radius:18px;background:#fff9e8;color:#26352b}nav{display:flex;flex-wrap:wrap;gap:16px}button{cursor:pointer}button:disabled{cursor:default;opacity:.55}[hidden]{display:none!important}</style></head><body data-unit="4"><header class="site-header"><a href="../game-garden/">返回根式遊戲大觀園</a><h1>第4單元｜根式四則運算</h1></header><main><p>自主練習 · 每回合十題 · 不限時</p><p>直接輸入最簡根式。答錯可以提示與訂正，完成訂正後前進；首次結果獨立保留。此處不是指定補救，不產生正式通關或重挑資格。</p><p id="save-status" role="status"></p><p id="message" role="alert"></p><button id="new">開始新的十題練習</button><section id="workspace" hidden><h2 id="progress"></h2><p id="question"></p><form id="answer-form"><label for="answer">請輸入最簡答案</label><input id="answer" maxlength="256" autocomplete="off" inputmode="none" spellcheck="false"><div id="symbols" aria-label="數學鍵盤"></div><button id="submit">確認答案</button></form><p id="feedback" role="status"></p><nav><button id="hint">給我提示</button><button id="next">下一題</button></nav><p id="hint-text"></p></section><section id="result" hidden><h2>水晶練習完成！</h2><p id="result-text"></p></section></main><script type="module" src="../src/practice-live/advanced.mjs"></script></body></html>
