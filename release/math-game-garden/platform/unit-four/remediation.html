<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="icon" href="../crystal-cart-demo/assets/crystal_blue_candidate.png"><link rel="stylesheet" href="style.css"><title>第四單元｜根式四則指定補救</title></head><body><header><h1>根式四則補強室</h1><a href="../crystal-cart-formal/">返回水晶礦車</a><a href="../game-garden/">返回大觀園</a></header><main><p id="save-status" role="status">正在讀取已確認紀錄…</p><p id="message" role="alert"></p><nav><button id="new" disabled>開始指定補救</button><button id="reload">重新讀取紀錄</button></nav><section id="workspace" hidden><h2 id="progress"></h2><p id="question" class="math"></p><form id="answer-form"><label for="answer">輸入最簡根式答案</label><input id="answer" maxlength="256" autocomplete="off" autocapitalize="off" spellcheck="false" aria-describedby="input-help"><small id="input-help">不限時；可輸入 √、分數及括號。訂正不回補首次成績。</small><div id="symbols"></div><button id="submit" type="submit">確認答案</button></form><p id="feedback" role="status"></p><nav><button id="hint">給我提示</button><button id="next">下一題</button><button id="finish" hidden>確認完成補救</button></nav><p id="hint-text"></p><p id="score"></p></section><section id="result" hidden><h2>本次補救成果</h2><p id="result-text"></p><a href="../crystal-cart-formal/">返回水晶礦車查看狀態</a></section><details><summary>補救歷史紀錄</summary><ul id="history"></ul></details><footer>僅指定補救，綁定已結算未達標的正式回合。十題首次至少八題正確，交易確認後取得一次重挑資格。輸入後須提交才會保存；關頁不保證保存未提交文字。</footer></main><script type="module" src="main.mjs"></script></body></html>
